<!DOCTYPE html>
<html>
<head>
  <title>Cyclone Nutrition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --orange: #f15a24;
      --black: #050505;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Impact, Arial Black, Arial, sans-serif;
      background: var(--black);
      color: var(--white);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 18px 36px;
      background: radial-gradient(circle at top, #171717 0%, #000 65%);
    }

    .logo {
      width: 100%;
      display: block;
      margin: 0 auto 24px;
      border-bottom: 3px solid var(--orange);
      padding-bottom: 20px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 26px 0 22px;
    }

    .line {
      flex: 1;
      height: 3px;
      background: var(--orange);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 1px;
      text-align: center;
      white-space: nowrap;
    }

    .field {
      display: flex;
      margin-bottom: 14px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #555;
      background: white;
    }

    .icon {
      width: 62px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    input, select {
      flex: 1;
      width: 100%;
      border: none;
      padding: 18px;
      font-size: 22px;
      font-family: Arial, sans-serif;
      color: #333;
      background: #fff;
      outline: none;
    }

    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #000 50%),
        linear-gradient(135deg, #000 50%, transparent 50%);
      background-position:
        calc(100% - 26px) 50%,
        calc(100% - 18px) 50%;
      background-size: 8px 8px, 8px 8px;
      background-repeat: no-repeat;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 20px;
      border: none;
      border-radius: 10px;
      background: var(--orange);
      color: #000;
      font-size: 28px;
      font-family: Impact, Arial Black, Arial, sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .notice {
      margin-top: 22px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 18px;
      color: #eee;
      line-height: 1.5;
    }

    .notice strong {
      color: var(--orange);
      font-size: 22px;
    }

    #msg {
      margin-top: 18px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 18px;
      color: var(--orange);
    }

    @media (max-width: 420px) {
      h1 { font-size: 27px; }
      input, select { font-size: 19px; }
      button { font-size: 24px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <img class="logo" src="Cyclone Nutrition.png" alt="Cyclone Nutrition logo" />

    <div class="title-row">
      <div class="line"></div>
      <h1>PLACE YOUR ORDER</h1>
      <div class="line"></div>
    </div>

    <div class="field">
      <div class="icon">👤</div>
      <input id="name" placeholder="Student Name" />
    </div>

    <div class="field">
      <div class="icon">🎓</div>
      <select id="grade">
        <option value="">Select Grade</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>
    </div>

    <div class="field">
      <div class="icon">🕘</div>
      <select id="pickup">
        <option value="">Select Pickup Time</option>
        <option>Before School</option>
        <option>2nd Chance Breakfast</option>
        <option>After School</option>
      </select>
    </div>

    <div class="field">
      <div class="icon">🥤</div>
      <select id="shake">
        <option value="">Select Shake Flavor</option>
        <option>Chocolate</option>
        <option>Strawberry</option>
        <option>Vanilla</option>
        <option>Flavor of the Week</option>
      </select>
    </div>

    <button onclick="submitOrder()">➤ SUBMIT ORDER</button>

    <div class="notice">
      🕘 Testing cutoff: <strong>11:59 PM</strong><br />
      One order per student, per day
    </div>

    <p id="msg"></p>
  </main>

  <script>
    const cutoff = "23:59";

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydZg5IJuBTVGbcw0feOC9jq1WsoxG6-3EF964_rXrAN7_OVyPcv4qWo45qgn4rph9g/exec";

    function getTodayKey() {
      return new Date().toISOString().split("T")[0];
    }

    async function submitOrder() {
      const msg = document.getElementById("msg");

      const now = new Date();
      const cutoffTime = new Date();
      const [h, m] = cutoff.split(":");
      cutoffTime.setHours(h, m, 0, 0);

      if (now > cutoffTime) {
        msg.innerText = "Ordering is closed for today.";
        return;
      }

      const name = document.getElementById("name").value.trim();
      const grade = document.getElementById("grade").value;
      const pickup = document.getElementById("pickup").value;
      const shake = document.getElementById("shake").value;

      if (!name || !grade || !pickup || !shake) {
        msg.innerText = "Please complete all fields.";
        return;
      }

      const key = `${getTodayKey()}-${name.toLowerCase()}-${grade}`;

      if (localStorage.getItem(key)) {
        msg.innerText = "An order has already been submitted for this student today.";
        return;
      }

      const order = {
        name,
        grade,
        pickup,
        shake,
        date: getTodayKey()
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(order)
        });

        localStorage.setItem(key, JSON.stringify(order));

        document.getElementById("name").value = "";
        document.getElementById("grade").value = "";
        document.getElementById("pickup").value = "";
        document.getElementById("shake").value = "";

        msg.innerText = "Order submitted!";
      } catch (error) {
        msg.innerText = "Something went wrong. Please try again.";
      }
    }
  </script>
</body>
</html>
